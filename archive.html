<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 Daily German Lab Archive | 過去の学習データ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Hiragino Sans','Yu Gothic',Arial,sans-serif;background:#f7f5f0;color:#25211b;min-height:100vh;line-height:1.6}
a{color:#1d4ed8}
#site-header{background:linear-gradient(135deg,#1f2937 0%,#7f1d1d 55%,#111827 100%);color:#fff;padding:16px 24px}
#header-row{display:flex;justify-content:space-between;align-items:center;max-width:1160px;margin:0 auto;flex-wrap:wrap;gap:10px}
#site-header h1{font-size:18px;font-weight:800}
#site-header h1 .sub{font-size:12px;font-weight:400;opacity:.62;margin-left:8px}
.wrap{max-width:1160px;margin:0 auto;padding:22px 20px 60px}
#tab-nav{background:#fff;border-bottom:2px solid #e7e2d8;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tab-nav::-webkit-scrollbar{display:none}
#tab-nav-inner{display:inline-flex;padding:0 20px}
.tab-btn{border:none;background:none;padding:10px 16px;font-size:12.5px;font-weight:600;color:#7a7364;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:#7f1d1d;border-bottom-color:#dc2626}
.meta-bar{margin:20px 0}
.meta-date{font-size:16px;font-weight:800;color:#1f2937}
.section{margin-bottom:28px}
.sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#8a8371;margin-bottom:14px}
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:760px){.card-grid{grid-template-columns:1fr}}
.vcard{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 1px 6px rgba(0,0,0,.06);border:1px solid #efe9dc;border-top:4px solid #94a3b8}
.vc-term{font-size:17px;font-weight:800;color:#1f2937}
.vc-mean-ja{font-size:13.5px;font-weight:700;color:#7f1d1d;margin-top:5px}
.vc-grammar{font-size:11.5px;color:#374151;margin-top:5px}
.vc-ex{margin-top:9px;padding-left:12px;border-left:3px solid #eef2f0}
.vc-ex p{font-size:12px;color:#4b4638;margin-bottom:2px}
.vc-ex .ja{font-size:11px;color:#8a8371;margin-bottom:4px}
.vc-expl{margin-top:10px;background:#fffbf0;border:1px solid #f3e6c8;border-radius:9px;padding:10px 12px}
.vc-expl p{font-size:12px;color:#4b4638;line-height:1.7}
#empty-note{color:#a8a190;font-size:13px;padding:30px 0}
#footer-actions{margin-top:20px}
.btn{padding:9px 16px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid #d9d3c2;background:#fff;color:#3a352b;text-decoration:none}
</style>
</head>
<body>
<div id="site-header">
  <div id="header-row">
    <h1>📦 Daily German Lab Archive <span class="sub">15日目以前のバックアップデータ</span></h1>
  </div>
</div>
<div id="tab-nav"><div id="tab-nav-inner"></div></div>
<div class="wrap">
  <div id="panels"></div>
  <div id="footer-actions"><a class="btn" href="index.html">← 最新14日分（トップページ）に戻る</a></div>
</div>

<script>
// ── START_DATA ──
const GERMAN_REPORTS = [
{
  date: "2026-01-01",
  dateLabel: "サンプル日（実際の初日はセットアップ時に生成）",
  readTimeMin: 18,
  coreItems: [
    {
      type: "noun", term: "das Haus", plural: "die Häuser",
      meaning_ja: "家",
      examples: [
        { de: "Das Haus ist sehr groß.", ja: "その家はとても大きいです。" },
        { de: "Wir wohnen in einem kleinen Haus.", ja: "私たちは小さな家に住んでいます。" }
      ],
      related: [ { term: "die Wohnung", note_ja: "「マンション・アパートの一室」。Hausは一戸建てのイメージ、Wohnungは集合住宅の1室。" } ],
      explanation_ja: "中性名詞（das）。複数形は語幹の母音がウムラウト化して die Häuser になる、よくあるパターン。家に関する語（zu Hause=家で、nach Hause=家へ）とセットで覚えると効率的。"
    },
    {
      type: "noun", term: "die Arbeit", plural: "die Arbeiten",
      meaning_ja: "仕事、労働",
      examples: [
        { de: "Ich gehe jeden Tag zur Arbeit.", ja: "私は毎日仕事に行きます。" },
        { de: "Die Arbeit macht mir Spaß.", ja: "仕事は楽しいです。" }
      ],
      related: [ { term: "arbeiten", note_ja: "動詞形「働く」。名詞Arbeitと語源が同じで、seiまとめて覚えると語彙が2倍になる。" } ],
      explanation_ja: "女性名詞（die）。\"zur Arbeit gehen\"（仕事に行く）は日常会話で非常によく使う定型表現。"
    },
    {
      type: "noun", term: "der Freund / die Freundin", plural: "die Freunde",
      meaning_ja: "友達（男性形／女性形）",
      examples: [
        { de: "Er ist mein bester Freund.", ja: "彼は私の親友です。" },
        { de: "Sie hat viele Freundinnen.", ja: "彼女には友達（女性）がたくさんいます。" }
      ],
      related: [ { term: "der Kollege / die Kollegin", note_ja: "「同僚」。friend/colleagueの区別が日本語よりはっきりしているのがドイツ語の特徴。" } ],
      explanation_ja: "男性名詞・女性名詞のペア。ドイツ語では人を表す名詞の多くに男性形/女性形（-in）のペアがある。恋人の意味にもなりうる（文脈で判断）。"
    },
    {
      type: "verb", term: "wohnen", conjugation: "ich wohne / du wohnst / er-sie-es wohnt",
      meaning_ja: "住む",
      examples: [
        { de: "Ich wohne in Tokio.", ja: "私は東京に住んでいます。" },
        { de: "Wo wohnst du?", ja: "あなたはどこに住んでいますか？" }
      ],
      related: [ { term: "leben", note_ja: "「生きる、暮らす」。wohnenは「住所として住む」、lebenはより広く「生活する・生きる」というニュアンス。" } ],
      explanation_ja: "規則動詞（規則的に変化する動詞）。語幹 wohn- に -e/-st/-t を付けるだけなので、規則変化のお手本として最初に覚えるべき動詞の一つ。"
    },
    {
      type: "verb", term: "brauchen", conjugation: "ich brauche / du brauchst / er-sie-es braucht",
      meaning_ja: "必要とする",
      examples: [
        { de: "Ich brauche deine Hilfe.", ja: "私はあなたの助けが必要です。" },
        { de: "Wir brauchen mehr Zeit.", ja: "私たちにはもっと時間が必要です。" }
      ],
      related: [ { term: "benötigen", note_ja: "同じ「必要とする」だが、よりフォーマルな響き。日常会話ではbrauchenが圧倒的に多い。" } ],
      explanation_ja: "規則動詞。\"brauchen + 4格（Akkusativ）\"の形を取る（＝目的語は4格）。ドイツ語学習の最初期に格変化の練習として使われることが多い動詞。"
    },
    {
      type: "verb", term: "helfen", conjugation: "ich helfe / du hilfst / er-sie-es hilft",
      meaning_ja: "助ける、手伝う",
      examples: [
        { de: "Kannst du mir helfen?", ja: "私を手伝ってもらえますか？" },
        { de: "Er hilft seiner Mutter.", ja: "彼は母親を手伝います。" }
      ],
      related: [ { term: "die Hilfe", note_ja: "名詞形「助け」。\"Hilfe!\"だけで「助けて！」という叫び声にもなる。" } ],
      explanation_ja: "不規則動詞（幹母音変化 e→i）。du/erの形でhelfe→hilfst/hilftと変化するのがA2の重要ポイント。さらに\"helfen\"は3格（Dativ）を取る動詞（＝目的語が3格）という、日本人学習者が間違えやすい重要な例外。"
    }
  ],
  adjectives: [
    {
      term: "wichtig",
      meaning_ja: "重要な",
      examples: [
        { de: "Das ist mir sehr wichtig.", ja: "それは私にとってとても重要です。" },
        { de: "Eine wichtige Frage.", ja: "重要な質問。" }
      ],
      related: [ { term: "unwichtig", note_ja: "「重要でない」。un-を付けると反対の意味になるパターンは他の形容詞にも応用できる。" } ],
      explanation_ja: "\"mir wichtig\"（私にとって重要）のように、人称代名詞の3格と組み合わせるのが定番パターン。"
    },
    {
      term: "müde",
      meaning_ja: "疲れた、眠い",
      examples: [
        { de: "Ich bin heute sehr müde.", ja: "私は今日とても疲れています。" },
        { de: "Bist du müde?", ja: "あなたは疲れていますか？" }
      ],
      related: [ { term: "fit", note_ja: "「元気な、調子がいい」。müde⇔fitで対比的に覚えると定着しやすい。" } ],
      explanation_ja: "\"sein\"（〜である）と組み合わせて体調・状態を表す最頻出の形容詞の一つ。"
    }
  ],
  phrases: [
    {
      phrase: "Wie geht es dir?",
      meaning_ja: "元気？（くだけた言い方、親しい相手に）",
      examples: [
        { de: "Hallo! Wie geht es dir?", ja: "こんにちは！元気？" },
        { de: "Mir geht es gut, danke. Und dir?", ja: "元気だよ、ありがとう。あなたは？" }
      ],
      explanation_ja: "フォーマルな場面では \"Wie geht es Ihnen?\"（Sie形）を使う。答え方の定番は \"Mir geht es gut/schlecht/so lala.\""
    },
    {
      phrase: "Das macht nichts.",
      meaning_ja: "気にしないで、大丈夫だよ",
      examples: [
        { de: "Entschuldigung, ich bin spät! – Das macht nichts.", ja: "遅れてごめん！ — 大丈夫だよ。" },
        { de: "Das macht nichts, das kann jedem passieren.", ja: "気にしないで、誰にでも起こりうることだから。" }
      ],
      explanation_ja: "直訳は「それは何もしない（＝影響しない）」。謝罪への返答として非常によく使われる定型句。"
    }
  ],
  grammarTip: {
    title: "なぜ3つも冠詞があるの？ der / die / das のイメージ",
    body_ja: "ドイツ語の名詞にはすべて「文法上の性」があり、それぞれ der（男性）・die（女性）・das（中性）という冠詞が付きます。これは日本語にも英語にもない概念で、多くの学習者がつまずくポイントです。重要なのは「実際の性別と一致するとは限らない」ということ — 例えば das Mädchen（少女）は中性名詞です。効率的な学習法は、単語を覚えるときに必ず冠詞ごとセットで覚えること（\"Haus\" ではなく \"das Haus\" として記憶する）。この習慣が、後の格変化（Nominativ/Akkusativ/Dativ）の理解を大きく助けます。"
  },
  todayQuiz: [
    { question: "「Haus（家）」の正しい冠詞はどれ？", choices: ["der", "die", "das", "die（複数形のみ）"], answerIndex: 2, explanation: "Hausは中性名詞なのでdas Hausが正解。複数形はdie Häuser。" },
    { question: "Ergänze: „Ich ___ in Berlin.\"（wohnenを正しい形に）", choices: ["wohne", "wohnst", "wohnt", "wohnen"], answerIndex: 0, explanation: "主語がich（1人称単数）なので語尾は-e。ich wohneが正解。" },
    { question: "Ergänze: „Er ___ mir.\"（helfenを正しい形に）", choices: ["helft", "hilfst", "hilft", "helfe"], answerIndex: 2, explanation: "helfenは幹母音変化する不規則動詞。3人称単数（er）はhilftになる（e→i）。" },
    { question: "「müde」の意味は？", choices: ["重要な", "疲れた", "友達", "家"], answerIndex: 1, explanation: "müdeは「疲れた、眠い」という意味の形容詞。" },
    { question: "親しい相手に「元気？」と聞くドイツ語のフレーズは？", choices: ["Wie geht es dir?", "Das macht nichts.", "Ich brauche Hilfe.", "Wo wohnst du?"], answerIndex: 0, explanation: "「Wie geht es dir?」がくだけた「元気？」にあたる定番フレーズ。" },
    { question: "「der Freund」の複数形は？", choices: ["die Freunde", "die Freunds", "der Freunde", "das Freunde"], answerIndex: 0, explanation: "複数形はdie Freunde。ドイツ語の複数形にはdieを使うのが基本ルール。" },
    { question: "Ergänze: „Ich ___ neue Schuhe.\"（brauchenを正しい形に）", choices: ["brauche", "brauchst", "braucht", "brauchen"], answerIndex: 0, explanation: "主語がich（1人称単数）なのでbraucheが正解。" },
    { question: "「Das macht nichts.」の意味は？", choices: ["それは大丈夫、気にしないで", "ありがとう", "さようなら", "お腹が空いた"], answerIndex: 0, explanation: "謝罪への返答として使われる「気にしないで、大丈夫だよ」という意味の定型句。" }
  ]
}
];
// ── END_DATA ──  (last sync: 2026-09-29)

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function card(term, grammar, meaningJa, exs, explJa){
  return '<div class="vcard">' +
    '<div class="vc-term">'+esc(term)+'</div>' +
    (grammar?'<div class="vc-grammar">'+esc(grammar)+'</div>':'') +
    '<div class="vc-mean-ja">'+esc(meaningJa)+'</div>' +
    '<div class="vc-ex">' + (exs||[]).map(function(e){ return '<p>„'+esc(e.de)+'“</p><div class="ja">'+esc(e.ja)+'</div>'; }).join('') + '</div>' +
    '<div class="vc-expl"><p>'+esc(explJa)+'</p></div>' +
    '</div>';
}

function renderPanel(r){
  return '<div class="meta-bar"><div class="meta-date">'+esc(r.dateLabel)+'</div></div>' +
    '<div class="section"><div class="sec-title">名詞・動詞</div><div class="card-grid">' +
      r.coreItems.map(function(it){ return card(it.term, it.plural||it.conjugation, it.meaning_ja, it.examples, it.explanation_ja); }).join('') + '</div></div>' +
    '<div class="section"><div class="sec-title">形容詞</div><div class="card-grid">' +
      r.adjectives.map(function(it){ return card(it.term, '', it.meaning_ja, it.examples, it.explanation_ja); }).join('') + '</div></div>' +
    '<div class="section"><div class="sec-title">基本フレーズ</div><div class="card-grid">' +
      r.phrases.map(function(it){ return card(it.phrase, '', it.meaning_ja, it.examples, it.explanation_ja); }).join('') + '</div></div>';
}

let currentIdx = GERMAN_REPORTS.length - 1;

function renderTabs(){
  const nav = document.getElementById('tab-nav-inner');
  nav.innerHTML = GERMAN_REPORTS.map(function(r, i){
    return '<button class="tab-btn'+(i===currentIdx?' active':'')+'" onclick="selectDay('+i+')">'+r.date+'</button>';
  }).join('');
}
function selectDay(i){ currentIdx = i; renderTabs(); renderAll(); }
function renderAll(){
  const panels = document.getElementById('panels');
  if(GERMAN_REPORTS.length === 0){
    panels.innerHTML = '<div id="empty-note">まだアーカイブデータはありません。index.html が15日分を超えると、直近14日より前のエントリーが自動的にここへ移動します。</div>';
    document.getElementById('tab-nav').style.display = 'none';
    return;
  }
  panels.innerHTML = renderPanel(GERMAN_REPORTS[currentIdx]);
}
renderTabs();
renderAll();
</script>
</body>
</html>
